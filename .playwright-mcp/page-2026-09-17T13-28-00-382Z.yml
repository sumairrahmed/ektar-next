    - generic [ref=f3e73]:
      - generic [ref=f3e74]:
        - generic [ref=f3e75]: Why banks move signing in-house
        - heading "A third-party portal breaks the journey and holds your record." [level=2] [ref=f3e76]
        - paragraph [ref=f3e77]: Most banks sign through an external e-signature platform. That means a customer receives an email that is not from the bank, is redirected to another brand's portal, and verifies with that platform's own SMS OTP — an event with no link to their banking identity. The signed documents and the audit trail then live in the vendor's platform, where the bank is a tenant and pricing or availability changes affect access to its own records.
        - generic [ref=f3e78]:
          - generic [ref=f3e79]:
            - paragraph [ref=f3e80]: Experience
            - paragraph [ref=f3e81]: The journey leaves the bank
            - paragraph [ref=f3e82]: Another brand's email, domain and portal sit in the middle of a regulated banking action.
          - generic [ref=f3e83]:
            - paragraph [ref=f3e84]: Identity
            - paragraph [ref=f3e85]: Signing is not tied to the customer
            - paragraph [ref=f3e86]: A vendor OTP proves access to an inbox or a phone number, not that your verified customer signed.
          - generic [ref=f3e87]:
            - paragraph [ref=f3e88]: Custody & cost
            - paragraph [ref=f3e89]: The bank does not own the record
            - paragraph [ref=f3e90]: Audit trail held externally, priced per envelope. ekSign replaces that with a marginal cost per signing event on infrastructure the bank already runs.
      - generic [ref=f3e91]:
        - generic [ref=f3e92]: How it works
        - heading "Two capabilities, joined into one product" [level=2] [ref=f3e93]
        - paragraph [ref=f3e94]: Every signature is mathematically bound to the exact document and to a verified identity — so nothing about it can be faked, altered, or disputed later.
        - generic [ref=f3e95]:
          - generic [ref=f3e96]:
            - paragraph [ref=f3e97]: "01"
            - paragraph [ref=f3e98]: Tamper-evident by design
            - paragraph [ref=f3e99]: Alter one character after signing, and verification fails immediately.
          - generic [ref=f3e100]:
            - paragraph [ref=f3e101]: "02"
            - paragraph [ref=f3e102]: Bound to a verified identity
            - paragraph [ref=f3e103]: The bank's existing MFA fires at the moment of signing, so the signature is tied to a real, verified customer.
          - generic [ref=f3e104]:
            - paragraph [ref=f3e105]: "03"
            - paragraph [ref=f3e106]: Non-customers verified too
            - paragraph [ref=f3e107]: Guarantors and co-applicants sign using national digital ID — no bank account or new app required.
          - generic [ref=f3e108]:
            - paragraph [ref=f3e109]: "04"
            - paragraph [ref=f3e110]: One complete audit record
            - paragraph [ref=f3e111]: Every signature, chained to the ones before it, held entirely on the bank's own systems.
      - generic [ref=f3e112]:
        - generic [ref=f3e113]: Who can sign, and how
        - heading "One customer, many parties, one process" [level=2] [ref=f3e114]
        - generic [ref=f3e115]:
          - generic [ref=f3e116]:
            - paragraph [ref=f3e117]: "01"
            - paragraph [ref=f3e118]: A single customer
            - paragraph [ref=f3e119]: A push notification, a review inside the banking app, and one authentication step — the same MFA already used for transfers.
          - generic [ref=f3e120]:
            - paragraph [ref=f3e121]: "02"
            - paragraph [ref=f3e122]: Multiple signatories
            - paragraph [ref=f3e123]: Loan agreements, joint accounts, and mandate changes often need more than one signature. ekSign supports signing in sequence, in parallel, or a mix of both — the bank's workflow decides the order.
          - generic [ref=f3e124]:
            - paragraph [ref=f3e125]: "03"
            - paragraph [ref=f3e126]: Guarantors and other non-customers
            - paragraph [ref=f3e127]: A secure link sent from the bank's own domain, opened on a bank-branded page, verified with national digital ID — no bank account or app required.
