    - generic [ref=f4e73]:
      - generic [ref=f4e74]:
        - generic [ref=f4e75]: Why banks move signing in-house
        - heading "A third-party portal breaks the journey and holds your record." [level=2] [ref=f4e76]
        - paragraph [ref=f4e77]: Most banks sign through an external e-signature platform. That means a customer receives an email that is not from the bank, is redirected to another brand's portal, and verifies with that platform's own SMS OTP — an event with no link to their banking identity. The signed documents and the audit trail then live in the vendor's platform, where the bank is a tenant and pricing or availability changes affect access to its own records.
        - generic [ref=f4e78]:
          - generic [ref=f4e79]:
            - paragraph [ref=f4e80]: Experience
            - paragraph [ref=f4e81]: The journey leaves the bank
            - paragraph [ref=f4e82]: Another brand's email, domain and portal sit in the middle of a regulated banking action.
          - generic [ref=f4e83]:
            - paragraph [ref=f4e84]: Identity
            - paragraph [ref=f4e85]: Signing is not tied to the customer
            - paragraph [ref=f4e86]: A vendor OTP proves access to an inbox or a phone number, not that your verified customer signed.
          - generic [ref=f4e87]:
            - paragraph [ref=f4e88]: Custody & cost
            - paragraph [ref=f4e89]: The bank does not own the record
            - paragraph [ref=f4e90]: Audit trail held externally, priced per envelope. ekSign replaces that with a marginal cost per signing event on infrastructure the bank already runs.
      - generic [ref=f4e91]:
        - generic [ref=f4e92]: How it works
        - heading "Two capabilities, joined into one product" [level=2] [ref=f4e93]
        - paragraph [ref=f4e94]: Every signature is mathematically bound to the exact document and to a verified identity — so nothing about it can be faked, altered, or disputed later.
        - generic [ref=f4e95]:
          - generic [ref=f4e96]:
            - paragraph [ref=f4e97]: "01"
            - paragraph [ref=f4e98]: Tamper-evident by design
            - paragraph [ref=f4e99]: Alter one character after signing, and verification fails immediately.
          - generic [ref=f4e100]:
            - paragraph [ref=f4e101]: "02"
            - paragraph [ref=f4e102]: Bound to a verified identity
            - paragraph [ref=f4e103]: The bank's existing MFA fires at the moment of signing, so the signature is tied to a real, verified customer.
          - generic [ref=f4e104]:
            - paragraph [ref=f4e105]: "03"
            - paragraph [ref=f4e106]: Non-customers verified too
            - paragraph [ref=f4e107]: Guarantors and co-applicants sign using national digital ID — no bank account or new app required.
          - generic [ref=f4e108]:
            - paragraph [ref=f4e109]: "04"
            - paragraph [ref=f4e110]: One complete audit record
            - paragraph [ref=f4e111]: Every signature, chained to the ones before it, held entirely on the bank's own systems.
      - generic [ref=f4e112]:
        - generic [ref=f4e113]: Who can sign, and how
        - heading "One customer, many parties, one process" [level=2] [ref=f4e114]
        - generic [ref=f4e115]:
          - generic [ref=f4e116]:
            - paragraph [ref=f4e117]: "01"
            - paragraph [ref=f4e118]: A single customer
            - paragraph [ref=f4e119]: A push notification, a review inside the banking app, and one authentication step — the same MFA already used for transfers.
          - generic [ref=f4e120]:
            - paragraph [ref=f4e121]: "02"
            - paragraph [ref=f4e122]: Multiple signatories
            - paragraph [ref=f4e123]: Loan agreements, joint accounts, and mandate changes often need more than one signature. ekSign supports signing in sequence, in parallel, or a mix of both — the bank's workflow decides the order.
          - generic [ref=f4e124]:
            - paragraph [ref=f4e125]: "03"
            - paragraph [ref=f4e126]: Guarantors and other non-customers
            - paragraph [ref=f4e127]: A secure link sent from the bank's own domain, opened on a bank-branded page, verified with national digital ID — no bank account or app required.
