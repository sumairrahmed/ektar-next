    - generic [ref=f2e73]:
      - generic [ref=f2e74]:
        - generic [ref=f2e75]: Why banks move signing in-house
        - heading "A third-party portal breaks the journey and holds your record." [level=2] [ref=f2e76]
        - paragraph [ref=f2e77]: Most banks sign through an external e-signature platform. That means a customer receives an email that is not from the bank, is redirected to another brand's portal, and verifies with that platform's own SMS OTP — an event with no link to their banking identity. The signed documents and the audit trail then live in the vendor's platform, where the bank is a tenant and pricing or availability changes affect access to its own records.
        - generic [ref=f2e78]:
          - generic [ref=f2e79]:
            - paragraph [ref=f2e80]: Experience
            - paragraph [ref=f2e81]: The journey leaves the bank
            - paragraph [ref=f2e82]: Another brand's email, domain and portal sit in the middle of a regulated banking action.
          - generic [ref=f2e83]:
            - paragraph [ref=f2e84]: Identity
            - paragraph [ref=f2e85]: Signing is not tied to the customer
            - paragraph [ref=f2e86]: A vendor OTP proves access to an inbox or a phone number, not that your verified customer signed.
          - generic [ref=f2e87]:
            - paragraph [ref=f2e88]: Custody & cost
            - paragraph [ref=f2e89]: The bank does not own the record
            - paragraph [ref=f2e90]: Audit trail held externally, priced per envelope. ekSign replaces that with a marginal cost per signing event on infrastructure the bank already runs.
      - generic [ref=f2e91]:
        - generic [ref=f2e92]: How it works
        - heading "Two capabilities, joined into one product" [level=2] [ref=f2e93]
        - paragraph [ref=f2e94]: Every signature is mathematically bound to the exact document and to a verified identity — so nothing about it can be faked, altered, or disputed later.
        - generic [ref=f2e95]:
          - generic [ref=f2e96]:
            - paragraph [ref=f2e97]: "01"
            - paragraph [ref=f2e98]: Tamper-evident by design
            - paragraph [ref=f2e99]: Alter one character after signing, and verification fails immediately.
          - generic [ref=f2e100]:
            - paragraph [ref=f2e101]: "02"
            - paragraph [ref=f2e102]: Bound to a verified identity
            - paragraph [ref=f2e103]: The bank's existing MFA fires at the moment of signing, so the signature is tied to a real, verified customer.
          - generic [ref=f2e104]:
            - paragraph [ref=f2e105]: "03"
            - paragraph [ref=f2e106]: Non-customers verified too
            - paragraph [ref=f2e107]: Guarantors and co-applicants sign using national digital ID — no bank account or new app required.
          - generic [ref=f2e108]:
            - paragraph [ref=f2e109]: "04"
            - paragraph [ref=f2e110]: One complete audit record
            - paragraph [ref=f2e111]: Every signature, chained to the ones before it, held entirely on the bank's own systems.
      - generic [ref=f2e112]:
        - generic [ref=f2e113]: Who can sign, and how
        - heading "One customer, many parties, one process" [level=2] [ref=f2e114]
        - generic [ref=f2e115]:
          - generic [ref=f2e116]:
            - paragraph [ref=f2e117]: "01"
            - paragraph [ref=f2e118]: A single customer
            - paragraph [ref=f2e119]: A push notification, a review inside the banking app, and one authentication step — the same MFA already used for transfers.
          - generic [ref=f2e120]:
            - paragraph [ref=f2e121]: "02"
            - paragraph [ref=f2e122]: Multiple signatories
            - paragraph [ref=f2e123]: Loan agreements, joint accounts, and mandate changes often need more than one signature. ekSign supports signing in sequence, in parallel, or a mix of both — the bank's workflow decides the order.
          - generic [ref=f2e124]:
            - paragraph [ref=f2e125]: "03"
            - paragraph [ref=f2e126]: Guarantors and other non-customers
            - paragraph [ref=f2e127]: A secure link sent from the bank's own domain, opened on a bank-branded page, verified with national digital ID — no bank account or app required.
