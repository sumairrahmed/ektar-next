      - generic [ref=e92]:
        - generic [ref=e93]: How binding works
        - heading "Two ways to prove the SIM. No OTP in either." [level=2] [ref=e94]
        - generic [ref=e95]:
          - generic [ref=e96]:
            - paragraph [ref=e97]: "01"
            - paragraph [ref=e98]: Silent Network Authentication
            - paragraph [ref=e99]: The SIM is confirmed with the mobile operator over the data connection. Nothing is sent to the customer, so there is nothing to intercept or socially engineer.
          - generic [ref=e100]:
            - paragraph [ref=e101]: "02"
            - paragraph [ref=e102]: Reverse SMS
            - paragraph [ref=e103]: The device sends the message rather than receiving a code — possession of the SIM is proven by the sender, not trusted from an inbound message.
          - generic [ref=e104]:
            - paragraph [ref=e105]: "03"
            - paragraph [ref=e106]: SIM-swap and port-out detection
            - paragraph [ref=e107]: A changed SIM breaks the binding. The session is re-verified before the transaction is allowed to continue.
      - generic [ref=e108]:
        - generic [ref=e109]: Why now
        - heading "Regulators are mandating device and SIM-level proof" [level=2] [ref=e110]
        - paragraph [ref=e111]: Saudi Arabia's SAMA framework mandates device-bound credentials, and Malaysia's BNM RMiT 2026 mandates device binding for every licensed bank — SIM-swap and port-out checks are a core part of meeting that bar.
