      - generic [ref=e31]:
        - generic [ref=e32]:
          - paragraph [ref=e33]: SIM binding · ekBind
          - heading "Bind the account to the SIM. Catch the swap." [level=1] [ref=e35]
          - paragraph [ref=e36]: ekBind verifies the SIM behind every session. Silent Network Authentication confirms the SIM directly with the mobile operator over the data connection — no code, no customer action. Reverse SMS proves possession of the SIM from the device itself. Both bind the account to a known SIM, so a swapped SIM or a moved number is caught before a transaction proceeds.
