      - generic [ref=e112]:
        - generic [ref=e113]: How binding works
        - heading "Two ways to prove the SIM. No OTP in either." [level=2] [ref=e114]
        - generic [ref=e115]:
          - generic [ref=e116]:
            - paragraph [ref=e117]: "01"
            - paragraph [ref=e118]: Silent Network Authentication
            - paragraph [ref=e119]: The SIM is confirmed with the mobile operator over the data connection. Nothing is sent to the customer, so there is nothing to intercept or socially engineer.
          - generic [ref=e120]:
            - paragraph [ref=e121]: "02"
            - paragraph [ref=e122]: Reverse SMS
            - paragraph [ref=e123]: The device sends the message rather than receiving a code — possession of the SIM is proven by the sender, not trusted from an inbound message.
          - generic [ref=e124]:
            - paragraph [ref=e125]: "03"
            - paragraph [ref=e126]: SIM-swap and port-out detection
            - paragraph [ref=e127]: A changed SIM breaks the binding. The session is re-verified before the transaction is allowed to continue.
      - generic [ref=e128]:
        - generic [ref=e129]: Why now
        - heading "Regulators are mandating device and SIM-level proof" [level=2] [ref=e130]
        - paragraph [ref=e131]: Saudi Arabia's SAMA framework mandates device-bound credentials, and Malaysia's BNM RMiT 2026 mandates device binding for every licensed bank — SIM-swap and port-out checks are a core part of meeting that bar.
