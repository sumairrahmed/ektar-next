    - generic [ref=e75]:
      - generic [ref=e76]:
        - generic [ref=e77]: Why banks move signing in-house
        - heading "A third-party portal breaks the journey and holds your record." [level=2] [ref=e78]
        - paragraph [ref=e79]: Most banks sign through an external e-signature platform. That means a customer receives an email that is not from the bank, is redirected to another brand's portal, and verifies with that platform's own SMS OTP — an event with no link to their banking identity. The signed documents and the audit trail then live in the vendor's platform, where the bank is a tenant and pricing or availability changes affect access to its own records.
        - generic [ref=e80]:
          - generic [ref=e81]:
            - paragraph [ref=e82]: Experience
            - paragraph [ref=e83]: The journey leaves the bank
            - paragraph [ref=e84]: Another brand's email, domain and portal sit in the middle of a regulated banking action.
          - generic [ref=e85]:
            - paragraph [ref=e86]: Identity
            - paragraph [ref=e87]: Signing is not tied to the customer
            - paragraph [ref=e88]: A vendor OTP proves access to an inbox or a phone number, not that your verified customer signed.
          - generic [ref=e89]:
            - paragraph [ref=e90]: Custody & cost
            - paragraph [ref=e91]: The bank does not own the record
            - paragraph [ref=e92]: Audit trail held externally, priced per envelope. ekSign replaces that with a marginal cost per signing event on infrastructure the bank already runs.
      - generic [ref=e93]:
        - generic [ref=e94]: How it works
        - heading "Two capabilities, joined into one product" [level=2] [ref=e95]
        - paragraph [ref=e96]: Every signature is mathematically bound to the exact document and to a verified identity — so nothing about it can be faked, altered, or disputed later.
        - generic [ref=e97]:
          - generic [ref=e98]:
            - paragraph [ref=e99]: "01"
            - paragraph [ref=e100]: Tamper-evident by design
            - paragraph [ref=e101]: Alter one character after signing, and verification fails immediately.
          - generic [ref=e102]:
            - paragraph [ref=e103]: "02"
            - paragraph [ref=e104]: Bound to a verified identity
            - paragraph [ref=e105]: The bank's existing MFA fires at the moment of signing, so the signature is tied to a real, verified customer.
          - generic [ref=e106]:
            - paragraph [ref=e107]: "03"
            - paragraph [ref=e108]: Non-customers verified too
            - paragraph [ref=e109]: Guarantors and co-applicants sign using national digital ID — no bank account or new app required.
          - generic [ref=e110]:
            - paragraph [ref=e111]: "04"
            - paragraph [ref=e112]: One complete audit record
            - paragraph [ref=e113]: Every signature, chained to the ones before it, held entirely on the bank's own systems.
      - generic [ref=e114]:
        - generic [ref=e115]: Who can sign, and how
        - heading "One customer, many parties, one process" [level=2] [ref=e116]
        - generic [ref=e117]:
          - generic [ref=e118]:
            - paragraph [ref=e119]: "01"
            - paragraph [ref=e120]: A single customer
            - paragraph [ref=e121]: A push notification, a review inside the banking app, and one authentication step — the same MFA already used for transfers.
          - generic [ref=e122]:
            - paragraph [ref=e123]: "02"
            - paragraph [ref=e124]: Multiple signatories
            - paragraph [ref=e125]: Loan agreements, joint accounts, and mandate changes often need more than one signature. ekSign supports signing in sequence, in parallel, or a mix of both — the bank's workflow decides the order.
          - generic [ref=e126]:
            - paragraph [ref=e127]: "03"
            - paragraph [ref=e128]: Guarantors and other non-customers
            - paragraph [ref=e129]: A secure link sent from the bank's own domain, opened on a bank-branded page, verified with national digital ID — no bank account or app required.
