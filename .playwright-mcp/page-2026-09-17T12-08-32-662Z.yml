      - generic [ref=f1e81]:
        - generic [ref=f1e82]: The business case
        - heading "Three reasons banks make the switch" [level=2] [ref=f1e83]
        - generic [ref=f1e84]:
          - generic [ref=f1e85]:
            - paragraph [ref=f1e86]: "01"
            - paragraph [ref=f1e87]: Reduce risk. Closes the phishing, SIM-swap, and replay gaps that SMS OTP can't.
          - generic [ref=f1e88]:
            - paragraph [ref=f1e89]: "02"
            - paragraph [ref=f1e90]: Save cost. Removes the per-message fee banks pay telecom operators on every SMS OTP, multiplied across millions of logins a month.
          - generic [ref=f1e91]:
            - paragraph [ref=f1e92]: "03"
            - paragraph [ref=f1e93]: Improve customer experience. One tap on a trusted device, replacing a code that's slow, easy to mistype, and frustrating to wait for.
      - generic [ref=f1e95]:
        - generic [ref=f1e96]: The breaking point
        - heading "SMS OTP is the weakest link in digital banking" [level=2] [ref=f1e97]
        - paragraph [ref=f1e98]: Six digits, no binding, no encryption — and every way of stealing them already works at scale.
        - generic [ref=f1e99]:
          - paragraph [ref=f1e102]:
            - strong [ref=f1e103]: Account takeover.
            - text: SIM swap, SS7 exploits and overlay malware intercept the code before it reaches the customer.
          - paragraph [ref=f1e106]:
            - strong [ref=f1e107]: Real-time phishing.
            - text: A code read aloud or typed into a fake screen reaches the attacker as fast as the customer.
          - paragraph [ref=f1e110]:
            - strong [ref=f1e111]: Zero transaction binding.
            - text: One code approves any amount, to anyone — no link to what it authorized.
          - paragraph [ref=f1e114]:
            - strong [ref=f1e115]: Regulatory bans.
            - text: CBUAE, SAMA, RBI, MAS and BSP have already outlawed it for high-risk transactions.
          - paragraph [ref=f1e118]:
            - strong [ref=f1e119]: Approval fatigue.
            - text: Look-alike prompts with no number matching train customers to tap "approve" on anything.
          - paragraph [ref=f1e122]:
            - strong [ref=f1e123]: Delivery & cost.
            - text: Carrier delays, dead zones and rising per-SMS fees erode trust and margin alike.
      - generic [ref=f1e124]:
        - generic [ref=f1e125]: Capabilities
        - heading "Everything ekShield does" [level=2] [ref=f1e126]
        - generic [ref=f1e127]:
          - generic [ref=f1e128]:
            - paragraph [ref=f1e129]: "01"
            - paragraph [ref=f1e130]: Stays inside your own infrastructure. Every credential, key, and log lives on the bank's own servers — never on Ektar's.
          - generic [ref=f1e131]:
            - paragraph [ref=f1e132]: "02"
            - paragraph [ref=f1e133]: Extra checks trigger automatically. Step-up verification is driven directly by the bank's own fraud-risk score, not a fixed rule.
          - generic [ref=f1e134]:
            - paragraph [ref=f1e135]: "03"
            - paragraph [ref=f1e136]: Works everywhere. Mobile, web, ATM, cards, contact centre, and messaging — across Retail, Corporate, and SME — all on one platform.
          - generic [ref=f1e137]:
            - paragraph [ref=f1e138]: "04"
            - paragraph [ref=f1e139]: Number matching. Addresses approval fatigue by requiring the customer to match a number, not just tap approve.
          - generic [ref=f1e140]:
            - paragraph [ref=f1e141]: "05"
            - paragraph [ref=f1e142]: Fully offline-capable, with silent registration and automatic key rotation running in the background.
          - generic [ref=f1e143]:
            - paragraph [ref=f1e144]: "06"
            - paragraph [ref=f1e145]: Card-not-present coverage, scheme-agnostic across Visa, Mastercard, and domestic schemes.
          - generic [ref=f1e146]:
            - paragraph [ref=f1e147]: "07"
            - paragraph [ref=f1e148]: Standalone white-label authenticator app, in addition to an embedded SDK.
          - generic [ref=f1e149]:
            - paragraph [ref=f1e150]: "08"
            - paragraph [ref=f1e151]: Pull-based recovery — customers can view and act on any missed approval, right inside the app.
      - generic [ref=f1e152]:
        - generic [ref=f1e153]: How it works
        - heading "The mechanism behind it" [level=2] [ref=f1e154]
        - generic [ref=f1e155]:
          - generic [ref=f1e156]:
            - paragraph [ref=f1e157]: "01"
            - paragraph [ref=f1e158]: On enrollment, the phone generates a rotating credential inside its own secure hardware chip.
          - generic [ref=f1e159]:
            - paragraph [ref=f1e160]: "02"
            - paragraph [ref=f1e161]: Every login or approval is signed with that credential and expires the instant it's used — nothing can be captured and replayed.
          - generic [ref=f1e162]:
            - paragraph [ref=f1e163]: "03"
            - paragraph [ref=f1e164]: Each approval is bound to the exact transaction it authorizes, so a stolen approval can't be reused for a different payment.
      - generic [ref=f1e165]:
        - generic [ref=f1e166]: Why now
        - heading "Regulators are banning the old way of proving it's you — and fraud losses are mounting." [level=2] [ref=f1e167]
        - paragraph [ref=f1e171]:
          - strong [ref=f1e172]: UAE (CBUAE), Saudi Arabia (SAMA), India (RBI), Singapore (MAS), and the Philippines (BSP)
          - text: have all banned or are phasing out SMS one-time codes as a standalone authentication method.
    - generic [ref=f1e174]:
      - heading "Ready to retire SMS OTP?" [level=3] [ref=f1e175]
