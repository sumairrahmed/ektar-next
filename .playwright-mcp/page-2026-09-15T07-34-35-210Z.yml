    - generic [ref=e74]:
      - generic [ref=e75]:
        - generic [ref=e76]: Why banks move signing in-house
        - heading "A third-party portal breaks the journey and holds your record." [level=2] [ref=e77]
        - paragraph [ref=e78]: Most banks sign through an external e-signature platform. That means a customer receives an email that is not from the bank, is redirected to another brand's portal, and verifies with that platform's own SMS OTP — an event with no link to their banking identity. The signed documents and the audit trail then live in the vendor's platform, where the bank is a tenant and pricing or availability changes affect access to its own records.
        - generic [ref=e79]:
          - generic [ref=e80]:
            - paragraph [ref=e81]: Experience
            - paragraph [ref=e82]: The journey leaves the bank
            - paragraph [ref=e83]: Another brand's email, domain and portal sit in the middle of a regulated banking action.
          - generic [ref=e84]:
            - paragraph [ref=e85]: Identity
            - paragraph [ref=e86]: Signing is not tied to the customer
            - paragraph [ref=e87]: A vendor OTP proves access to an inbox or a phone number, not that your verified customer signed.
          - generic [ref=e88]:
            - paragraph [ref=e89]: Custody & cost
            - paragraph [ref=e90]: The bank does not own the record
            - paragraph [ref=e91]: Audit trail held externally, priced per envelope. ekSign replaces that with a marginal cost per signing event on infrastructure the bank already runs.
      - generic [ref=e92]:
        - generic [ref=e93]: How it works
        - heading "Two capabilities, joined into one product" [level=2] [ref=e94]
        - paragraph [ref=e95]: Every signature is mathematically bound to the exact document and to a verified identity — so nothing about it can be faked, altered, or disputed later.
        - generic [ref=e96]:
          - generic [ref=e97]:
            - paragraph [ref=e98]: "01"
            - paragraph [ref=e99]: Tamper-evident by design
            - paragraph [ref=e100]: Alter one character after signing, and verification fails immediately.
          - generic [ref=e101]:
            - paragraph [ref=e102]: "02"
            - paragraph [ref=e103]: Bound to a verified identity
            - paragraph [ref=e104]: The bank's existing MFA fires at the moment of signing, so the signature is tied to a real, verified customer.
          - generic [ref=e105]:
            - paragraph [ref=e106]: "03"
            - paragraph [ref=e107]: Non-customers verified too
            - paragraph [ref=e108]: Guarantors and co-applicants sign using national digital ID — no bank account or new app required.
          - generic [ref=e109]:
            - paragraph [ref=e110]: "04"
            - paragraph [ref=e111]: One complete audit record
            - paragraph [ref=e112]: Every signature, chained to the ones before it, held entirely on the bank's own systems.
      - generic [ref=e113]:
        - generic [ref=e114]: Who can sign, and how
        - heading "One customer, many parties, one process" [level=2] [ref=e115]
        - generic [ref=e116]:
          - generic [ref=e117]:
            - paragraph [ref=e118]: "01"
            - paragraph [ref=e119]: A single customer
            - paragraph [ref=e120]: A push notification, a review inside the banking app, and one authentication step — the same MFA already used for transfers.
          - generic [ref=e121]:
            - paragraph [ref=e122]: "02"
            - paragraph [ref=e123]: Multiple signatories
            - paragraph [ref=e124]: Loan agreements, joint accounts, and mandate changes often need more than one signature. ekSign supports signing in sequence, in parallel, or a mix of both — the bank's workflow decides the order.
          - generic [ref=e125]:
            - paragraph [ref=e126]: "03"
            - paragraph [ref=e127]: Guarantors and other non-customers
            - paragraph [ref=e128]: A secure link sent from the bank's own domain, opened on a bank-branded page, verified with national digital ID — no bank account or app required.
      - generic [ref=e129]:
        - generic [ref=e130]: ekSign vs a third-party portal
