      - generic [ref=e110]:
        - generic [ref=e111]: How binding works
        - heading "Two ways to prove the SIM. No OTP in either." [level=2] [ref=e112]
        - generic [ref=e113]:
          - generic [ref=e114]:
            - paragraph [ref=e115]: "01"
            - paragraph [ref=e116]: Silent Network Authentication
            - paragraph [ref=e117]: The SIM is confirmed with the mobile operator over the data connection. Nothing is sent to the customer, so there is nothing to intercept or socially engineer.
          - generic [ref=e118]:
            - paragraph [ref=e119]: "02"
            - paragraph [ref=e120]: Reverse SMS
            - paragraph [ref=e121]: The device sends the message rather than receiving a code — possession of the SIM is proven by the sender, not trusted from an inbound message.
          - generic [ref=e122]:
            - paragraph [ref=e123]: "03"
            - paragraph [ref=e124]: SIM-swap and port-out detection
            - paragraph [ref=e125]: A changed SIM breaks the binding. The session is re-verified before the transaction is allowed to continue.
      - generic [ref=e126]:
        - generic [ref=e127]: Why now
        - heading "Regulators are mandating device and SIM-level proof" [level=2] [ref=e128]
        - paragraph [ref=e129]: Saudi Arabia's SAMA framework mandates device-bound credentials, and Malaysia's BNM RMiT 2026 mandates device binding for every licensed bank — SIM-swap and port-out checks are a core part of meeting that bar.
