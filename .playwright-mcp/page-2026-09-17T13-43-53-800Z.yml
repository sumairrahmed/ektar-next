      - generic [ref=e29]:
        - generic [ref=e30]:
          - paragraph [ref=e31]: SIM binding · ekBind
          - heading "Bind the account to the SIM. Catch the swap." [level=1] [ref=e33]
          - paragraph [ref=e34]: ekBind verifies the SIM behind every session. Silent Network Authentication confirms the SIM directly with the mobile operator over the data connection — no code, no customer action. Reverse SMS proves possession of the SIM from the device itself. Both bind the account to a known SIM, so a swapped SIM or a moved number is caught before a transaction proceeds.
