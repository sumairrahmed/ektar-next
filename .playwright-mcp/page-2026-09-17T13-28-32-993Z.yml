      - generic [ref=f5e105]:
        - generic [ref=f5e106]: How binding works
        - heading "Two ways to prove the SIM. No OTP in either." [level=2] [ref=f5e107]
        - generic [ref=f5e108]:
          - generic [ref=f5e109]:
            - paragraph [ref=f5e110]: "01"
            - paragraph [ref=f5e111]: Silent Network Authentication
            - paragraph [ref=f5e112]: The SIM is confirmed with the mobile operator over the data connection. Nothing is sent to the customer, so there is nothing to intercept or socially engineer.
          - generic [ref=f5e113]:
            - paragraph [ref=f5e114]: "02"
            - paragraph [ref=f5e115]: Reverse SMS
            - paragraph [ref=f5e116]: The device sends the message rather than receiving a code — possession of the SIM is proven by the sender, not trusted from an inbound message.
          - generic [ref=f5e117]:
            - paragraph [ref=f5e118]: "03"
            - paragraph [ref=f5e119]: SIM-swap and port-out detection
            - paragraph [ref=f5e120]: A changed SIM breaks the binding. The session is re-verified before the transaction is allowed to continue.
      - generic [ref=f5e121]:
        - generic [ref=f5e122]: Why now
        - heading "Regulators are mandating device and SIM-level proof" [level=2] [ref=f5e123]
        - paragraph [ref=f5e124]: Saudi Arabia's SAMA framework mandates device-bound credentials, and Malaysia's BNM RMiT 2026 mandates device binding for every licensed bank — SIM-swap and port-out checks are a core part of meeting that bar.
