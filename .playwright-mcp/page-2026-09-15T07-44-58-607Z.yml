      - generic [ref=e115]:
        - generic [ref=e116]: How binding works
        - heading "Two ways to prove the SIM. No OTP in either." [level=2] [ref=e117]
        - generic [ref=e118]:
          - generic [ref=e119]:
            - paragraph [ref=e120]: "01"
            - paragraph [ref=e121]: Silent Network Authentication
            - paragraph [ref=e122]: The SIM is confirmed with the mobile operator over the data connection. Nothing is sent to the customer, so there is nothing to intercept or socially engineer.
          - generic [ref=e123]:
            - paragraph [ref=e124]: "02"
            - paragraph [ref=e125]: Reverse SMS
            - paragraph [ref=e126]: The device sends the message rather than receiving a code — possession of the SIM is proven by the sender, not trusted from an inbound message.
          - generic [ref=e127]:
            - paragraph [ref=e128]: "03"
            - paragraph [ref=e129]: SIM-swap and port-out detection
            - paragraph [ref=e130]: A changed SIM breaks the binding. The session is re-verified before the transaction is allowed to continue.
      - generic [ref=e131]:
        - generic [ref=e132]: Why now
        - heading "Regulators are mandating device and SIM-level proof" [level=2] [ref=e133]
        - paragraph [ref=e134]: Saudi Arabia's SAMA framework mandates device-bound credentials, and Malaysia's BNM RMiT 2026 mandates device binding for every licensed bank — SIM-swap and port-out checks are a core part of meeting that bar.
