    - generic [ref=f1e75]:
      - generic [ref=f1e76]:
        - generic [ref=f1e77]: Why banks move signing in-house
        - heading "A third-party portal breaks the journey and holds your record." [level=2] [ref=f1e78]
        - paragraph [ref=f1e79]: Most banks sign through an external e-signature platform. That means a customer receives an email that is not from the bank, is redirected to another brand's portal, and verifies with that platform's own SMS OTP — an event with no link to their banking identity. The signed documents and the audit trail then live in the vendor's platform, where the bank is a tenant and pricing or availability changes affect access to its own records.
        - generic [ref=f1e80]:
          - generic [ref=f1e81]:
            - paragraph [ref=f1e82]: Experience
            - paragraph [ref=f1e83]: The journey leaves the bank
            - paragraph [ref=f1e84]: Another brand's email, domain and portal sit in the middle of a regulated banking action.
          - generic [ref=f1e85]:
            - paragraph [ref=f1e86]: Identity
            - paragraph [ref=f1e87]: Signing is not tied to the customer
            - paragraph [ref=f1e88]: A vendor OTP proves access to an inbox or a phone number, not that your verified customer signed.
          - generic [ref=f1e89]:
            - paragraph [ref=f1e90]: Custody & cost
            - paragraph [ref=f1e91]: The bank does not own the record
            - paragraph [ref=f1e92]: Audit trail held externally, priced per envelope. ekSign replaces that with a marginal cost per signing event on infrastructure the bank already runs.
      - generic [ref=f1e93]:
        - generic [ref=f1e94]: How it works
        - heading "Two capabilities, joined into one product" [level=2] [ref=f1e95]
        - paragraph [ref=f1e96]: Every signature is mathematically bound to the exact document and to a verified identity — so nothing about it can be faked, altered, or disputed later.
        - generic [ref=f1e97]:
          - generic [ref=f1e98]:
            - paragraph [ref=f1e99]: "01"
            - paragraph [ref=f1e100]: Tamper-evident by design
            - paragraph [ref=f1e101]: Alter one character after signing, and verification fails immediately.
          - generic [ref=f1e102]:
            - paragraph [ref=f1e103]: "02"
            - paragraph [ref=f1e104]: Bound to a verified identity
            - paragraph [ref=f1e105]: The bank's existing MFA fires at the moment of signing, so the signature is tied to a real, verified customer.
          - generic [ref=f1e106]:
            - paragraph [ref=f1e107]: "03"
            - paragraph [ref=f1e108]: Non-customers verified too
            - paragraph [ref=f1e109]: Guarantors and co-applicants sign using national digital ID — no bank account or new app required.
          - generic [ref=f1e110]:
            - paragraph [ref=f1e111]: "04"
            - paragraph [ref=f1e112]: One complete audit record
            - paragraph [ref=f1e113]: Every signature, chained to the ones before it, held entirely on the bank's own systems.
      - generic [ref=f1e114]:
        - generic [ref=f1e115]: Who can sign, and how
        - heading "One customer, many parties, one process" [level=2] [ref=f1e116]
        - generic [ref=f1e117]:
          - generic [ref=f1e118]:
            - paragraph [ref=f1e119]: "01"
            - paragraph [ref=f1e120]: A single customer
            - paragraph [ref=f1e121]: A push notification, a review inside the banking app, and one authentication step — the same MFA already used for transfers.
          - generic [ref=f1e122]:
            - paragraph [ref=f1e123]: "02"
            - paragraph [ref=f1e124]: Multiple signatories
            - paragraph [ref=f1e125]: Loan agreements, joint accounts, and mandate changes often need more than one signature. ekSign supports signing in sequence, in parallel, or a mix of both — the bank's workflow decides the order.
          - generic [ref=f1e126]:
            - paragraph [ref=f1e127]: "03"
            - paragraph [ref=f1e128]: Guarantors and other non-customers
            - paragraph [ref=f1e129]: A secure link sent from the bank's own domain, opened on a bank-branded page, verified with national digital ID — no bank account or app required.
